[project]
name = "pywarp"
description = "Python WebAuthn Relying Party library"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Andrey Kislyuk", email = "kislyuk@gmail.com"}]
maintainers = [{name = "Andrey Kislyuk", email = "kislyuk@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyjwt >= 2.3.0",
    "cbor2 >= 5.2.0, < 6",
    "cryptography >= 3.3.2",
    "requests >= 2.25.1, < 3",
]

[project.urls]
Homepage = "https://github.com/pyauth/pywarp"
Documentation = "https://pyauth.github.io/pywarp/"
"Source Code" = "https://github.com/pyauth/pywarp"
"Issue Tracker" = "https://github.com/pyauth/pywarp/issues"
"Change Log" = "https://github.com/pyauth/pywarp/blob/main/Changes.rst"

[project.optional-dependencies]
tests = ["build", "coverage", "mypy", "ruff", "types-requests", "wheel"]
docs = ["furo", "sphinx"]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pywarp/version.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.mypy.overrides]]
module = ["cbor2", "pynamodb.*", "jwt"]
ignore_missing_imports = true
